<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
        <form method="post">
		<label for="Name">Name:</label>
			<input type="text" id="name"name="name"placeholder="Name" required>
			<br><br>
			<label for="Email">Email:</label>
			<input type="email" id="email"name="email"placeholder="Email" required>
			<br><br>
			<label for="Gender">Gender:</label>
			<input type="radio" id="male" name="gender" required>
			<br><br>
			<label for="Car Brands">Car Brands:</label>
			<input type="Select" id="cars"name="cars"placeholder="--Please choose an option--" required>
			<br><br>
			<label for="Age">Age:</label>
			<input type="number"id="age"name="age"placeholder="Age" required>
			<br><br>
				<label for="DOB">DOB:</label>
			<input type="Date"id="dob"name="dob" required>
			<br><br>
			<label for="Phone Number">Phone Number:</label>
			<input type="Tel"id="tel"name="tel"placeholder="xxx-xxx-xxxx">
			<br><br>
			<label for="password">password:</label>
			<input type="password"id="password"name="password"placeholder="password" required>
			<br><br>
			<label for=I agree to the TOS>I agree to the TOS:</label>
			<input type="checkbox"id="tos"name="tos" required>
			<br><br>
			<input type="submit" value="submit">
		</form>
</body>

</html>
